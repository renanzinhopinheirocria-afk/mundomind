<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar Logo - Mind TECH</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#02020a; color:white; min-height:100vh; padding:20px; font-family:'JetBrains Mono',monospace; position:relative; overflow-x:hidden; }
  #stars{position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse at center, #1a0a3a 0%, #02020a 70%)}
  #grid{position:fixed;inset:0;z-index:-2;opacity:0.18}
  #particles{position:fixed;inset:0;z-index:-1}
  .container { max-width:720px; margin:0 auto; background:linear-gradient(180deg, rgba(18,8,40,0.92), rgba(8,4,20,0.95)); border:1px solid rgba(168,85,247,0.35); border-radius:24px; padding:32px; box-shadow:0 0 80px rgba(168,85,247,0.15), inset 0 1px 0 rgba(255,255,255,0.06); position:relative; overflow:hidden; backdrop-filter:blur(20px); z-index:2; }
  .container::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#a855f7,#06b6d4,transparent);box-shadow:0 0 20px #a855f7;animation:scan 3s linear infinite}
  @keyframes scan{0%{top:0}100%{top:100%}}
  .gridBg{position:absolute;inset:0;background:linear-gradient(rgba(168,85,247,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,0.04) 1px, transparent 1px);background-size:26px 26px;pointer-events:none;opacity:0.5}
  .corner{position:absolute;width:24px;height:24px;border:2px solid #a855f7;box-shadow:0 0 12px #a855f7;opacity:0.5;z-index:3}
  .c1{top:12px;left:12px;border-right:0;border-bottom:0} .c2{top:12px;right:12px;border-left:0;border-bottom:0} .c3{bottom:12px;left:12px;border-right:0;border-top:0} .c4{bottom:12px;right:12px;border-left:0;border-top:0}
  .voltar { color:#06b6d4; text-decoration:none; font-weight:700; font-size:11px; letter-spacing:1.5px; border:1px solid rgba(6,182,212,0.25); padding:8px 14px; border-radius:100px; background:rgba(6,182,212,0.08); transition:0.3s; position:relative; z-index:2; display:inline-flex; }
  .voltar:hover{background:rgba(6,182,212,0.15);box-shadow:0 0 15px rgba(6,182,212,0.3);transform:translateX(-2px)}
  .hero { text-align:center; margin:22px 0 28px 0; position:relative; z-index:2; }
  .hero h1 { font-family:Inter; font-size:36px; font-weight:900; text-shadow:0 0 25px #a855f7; letter-spacing:-1px; line-height:0.9; }
  .hero h1 span{color:#06b6d4;text-shadow:0 0 18px #06b6d4}
  .typewriter{font-size:11px;color:#8fa0c0;max-width:520px;margin:12px auto 0;min-height:32px;line-height:1.6}
  .typewriter::after{content:'_';color:#06b6d4;animation:blink 1s infinite}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
  #dropzone { border:2px dashed rgba(168,85,247,0.5); border-radius:20px; background:linear-gradient(180deg, rgba(18,8,38,0.9), rgba(8,4,20,0.8)); height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:0.4s cubic-bezier(.16,1,.3,1); margin-bottom:20px; position:relative; z-index:2; overflow:hidden; }
  #dropzone:hover, #dropzone.drag { border-color:#06b6d4; box-shadow:0 0 30px rgba(6,182,212,0.25), inset 0 0 30px rgba(168,85,247,0.08); transform:translateY(-3px) scale(1.01); }
  #dropzone .plus { font-size:80px; font-weight:900; color:#06b6d4; line-height:1; text-shadow:0 0 20px #06b6d4; transition:0.3s; }
  #dropzone:hover .plus{transform:scale(1.1) rotate(5deg)}
  #dropzone p { color:#c4b5fd; margin-top:10px; font-size:12px; letter-spacing:0.5px; }
  #dropzone .hint{font-size:9px;color:rgba(255,255,255,0.35);margin-top:6px;letter-spacing:1px}
  #preview { max-width:100%; max-height:250px; border-radius:12px; display:none; margin-bottom:15px; border:1px solid rgba(168,85,247,0.3); box-shadow:0 0 30px rgba(168,85,247,0.2); position:relative; z-index:2; }
  textarea { width:100%; height:130px; background:rgba(0,0,0,0.45); border:1.5px solid rgba(168,85,247,0.4); border-radius:14px; color:white; padding:16px; font-family:'JetBrains Mono'; font-size:13px; resize:none; outline:none; transition:0.3s; position:relative; z-index:2; }
  textarea:focus { border-color:#06b6d4; box-shadow:0 0 20px rgba(6,182,212,0.2); background:rgba(0,0,0,0.6); }
  button { width:100%; margin-top:20px; background:linear-gradient(90deg, #a855f7, #06b6d4); color:white; border:none; padding:16px; border-radius:14px; font-weight:900; font-size:13px; letter-spacing:1.5px; cursor:pointer; position:relative; overflow:hidden; transition:0.35s; box-shadow:0 0 30px rgba(168,85,247,0.3); z-index:2; }
  button::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);animation:btnShine 2.2s infinite}
  @keyframes btnShine{0%{left:-100%}100%{left:100%}}
  button:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 0 45px rgba(168,85,247,0.45)}
  #msg-sucesso { display:none; text-align:center; background:linear-gradient(180deg, rgba(6,182,212,0.12), rgba(168,85,247,0.08)); border:1px solid #06b6d4; border-radius:14px; padding:20px; margin-top:20px; color:#06b6d4; font-weight:700; font-size:12px; letter-spacing:0.5px; position:relative; z-index:2; box-shadow:0 0 20px rgba(6,182,212,0.15); }
  .badgeRow{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
  .badge{border:1px solid rgba(168,85,247,0.25);background:rgba(168,85,247,0.06);border-radius:100px;padding:6px 12px;font-size:9px;letter-spacing:1px;color:#c4b5fd;display:flex;align-items:center;gap:6px}
  .badge i{width:5px;height:5px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88;display:inline-block}
</style>
</head>
<body>
<div id="stars"></div>
<canvas id="grid"></canvas>
<canvas id="particles"></canvas>

<div class="container">
  <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
  <div class="gridBg"></div>
  <a class="voltar" href="mundinho.html">← VOLTAR AO MUNDO</a>
  <div class="hero">
    <h1>Enviar <span>Logo</span></h1>
    <div class="typewriter mono" id="typewriter"></div>
  </div>

  <form id="form-logo" action="https://formsubmit.co/fernandescruz2853@gmail.com" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="_subject" value="Novo pedido de alteração de logo">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">

    <div id="dropzone">
      <div class="plus">+</div>
      <p>Arraste sua logo aqui ou clique para selecionar</p>
      <div class="hint mono">PNG, JPG, SVG • PROTOCOLO: LOGO_SCAN • MAX 10MB</div>
      <input type="file" id="fileInput" name="logo" accept="image/*" style="display:none;" required>
      <img id="preview" alt="Preview da logo">
    </div>

    <textarea name="mensagem" id="mensagem" placeholder="Digite o que precisa mudar na logo e aperte Enter para enviar" required></textarea>
    
    <button type="submit">ENVIAR PARA ANÁLISE →</button>
  </form>

  <div id="msg-sucesso" class="mono">✓ PROTOCOLO RECEBIDO • Assim que meu programador ver você será respondido/a • LAT -29.6369 LON -51.0128</div>
  
  <div class="badgeRow">
    <div class="badge"><i></i> UPLOAD CRIPTOGRAFADO</div>
    <div class="badge"><i></i> MIND TECH • BUILD 51</div>
    <div class="badge"><i></i> SCANNER ATIVO</div>
  </div>
</div>

<script>
// EFEITOS VISUAIS - NÃO ALTERA SEU SCRIPT
const cG=document.getElementById('grid'), xG=cG.getContext('2d'); function rg(){cG.width=innerWidth;cG.height=innerHeight} rg(); addEventListener('resize',rg); let t=0;(function dg(){xG.clearRect(0,0,cG.width,cG.height);xG.strokeStyle='rgba(168,85,247,0.07)';xG.lineWidth=1;const s=60,off=(t*0.35)%s;for(let x=-s+off;x<cG.width+s;x+=s){xG.beginPath();xG.moveTo(x,0);xG.lineTo(x+cG.height*0.25,cG.height);xG.stroke()}for(let y=-s+off;y<cG.height+s;y+=s){xG.beginPath();xG.moveTo(0,y);xG.lineTo(cG.width,y+cG.width*0.08);xG.stroke()}t++;requestAnimationFrame(dg)})();
const cP=document.getElementById('particles'), xP=cP.getContext('2d'); function rp(){cP.width=innerWidth;cP.height=innerHeight} rp(); addEventListener('resize',rp); let parts=[]; for(let i=0;i<60;i++)parts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.2+0.3}); (function dp(){xP.clearRect(0,0,cP.width,cP.height);parts.forEach(p=>{xP.fillStyle='#a855f7';xP.shadowBlur=8;xP.shadowColor='#a855f7';xP.beginPath();xP.arc(p.x,p.y,p.r,0,Math.PI*2);xP.fill();p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>cP.width)p.vx*=-1;if(p.y<0||p.y>cP.height)p.vy*=-1});xP.shadowBlur=0;requestAnimationFrame(dp)})();
const txt="Arraste sua logo e diga o que precisa mudar. Nosso scanner analisa traços, cores e legibilidade em tempo real. Protocolo tech roxo ativado.";
let i=0; const el=document.getElementById('typewriter'); function type(){if(i<txt.length){el.textContent+=txt.charAt(i);i++;setTimeout(type,18)}} setTimeout(type,300);

// SEU SCRIPT ORIGINAL 100% PRESERVADO
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const form = document.getElementById('form-logo');
const msg = document.getElementById('msg-sucesso');
const textarea = document.getElementById('mensagem');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if(e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    showPreview(e.dataTransfer.files[0]);
  }
});
fileInput.addEventListener('change', () => {
  if(fileInput.files.length) showPreview(fileInput.files[0]);
});
function showPreview(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    preview.src = e.target.result;
    preview.style.display = 'block';
    // esconde o plus e texto quando tem preview
    dropzone.querySelector('.plus').style.display='none';
    dropzone.querySelector('p').style.display='none';
    dropzone.querySelector('.hint').style.display='none';
  }
  reader.readAsDataURL(file);
}
textarea.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
form.addEventListener('submit', (e) => {
  e.preventDefault();
  msg.style.display = 'block';
  msg.scrollIntoView({behavior:'smooth'});
  setTimeout(() => { form.submit(); }, 1500);
});
</script>
</body>
</html>
